services:
  hadoop:
    image: suhothayan/hadoop-spark-pig-hive:2.9.2
    platform: linux/amd64
    container_name: bda-hadoop
    hostname: bda-hadoop
    restart: unless-stopped
    ports:
      - "50070:50070"  # HDFS NameNode Web UI
      - "8088:8088"    # YARN ResourceManager Web UI
      - "19888:19888"  # JobHistory Server UI
      - "10000:10000"  # HiveServer2
      - "10002:10002"  # HiveServer2 Web UI
    volumes:
      - ..:/workspace
    working_dir: /workspace
    networks:
      - bda-network
    environment:
      - HADOOP_HOME=/usr/local/hadoop
      - SPARK_HOME=/usr/local/spark
      - PIG_HOME=/usr/local/pig
      - HIVE_HOME=/usr/local/hive
    stdin_open: true
    tty: true
    entrypoint:
      - /bin/bash
      - -c
      - |
        /etc/bootstrap.sh
        mkdir -p /var/lib/hive
        if [ ! -f /usr/local/hive/conf/hive-site.xml ]; then
          cat << 'EOF' > /usr/local/hive/conf/hive-site.xml
        <configuration>
          <property>
            <name>javax.jdo.option.ConnectionURL</name>
            <value>jdbc:derby:/var/lib/hive/metastore_db;create=true</value>
          </property>
          <property>
            <name>hive.metastore.warehouse.dir</name>
            <value>/user/hive/warehouse</value>
          </property>
        </configuration>
        EOF
          schematool -dbType derby -initSchema || true
        fi
        hdfs dfs -mkdir -p /user/hive/warehouse /tmp 2>/dev/null || true
        hdfs dfs -chmod -R 777 /user/hive /tmp 2>/dev/null || true
        tail -f /dev/null

  hbase:
    image: harisekhon/hbase:latest
    platform: linux/amd64
    container_name: bda-hbase
    hostname: bda-hbase
    restart: unless-stopped
    ports:
      - "16010:16010"  # HBase Master Web UI
      - "2181:2181"    # ZooKeeper
      - "18080:8080"   # HBase REST API (mapped to 18080 to avoid conflict)
      - "8085:8085"    # HBase Thrift
    volumes:
      - ..:/workspace
    working_dir: /workspace
    networks:
      - bda-network

networks:
  bda-network:
    driver: bridge
