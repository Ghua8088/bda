services:
  hadoop:
    image: suhothayan/hadoop-spark-pig-hive:2.9.2
    platform: linux/amd64
    container_name: bda-hadoop
    hostname: bda-hadoop
    restart: unless-stopped
    ports:
      - "50070:50070" # HDFS NameNode Web UI
      - "8088:8088" # YARN ResourceManager Web UI
      - "19888:19888" # JobHistory Server UI
      - "10000:10000" # HiveServer2
      - "10002:10002" # HiveServer2 Web UI
      - "9083:9083" # Hive Metastore Thrift
    volumes:
      - ..:/workspace
      - ./entrypoint-hadoop.sh:/entrypoint-hadoop.sh:ro
      - hive-metastore-data:/var/lib/hive
    working_dir: /workspace
    networks:
      - bda-network
    environment:
      - HADOOP_HOME=/usr/local/hadoop
      - SPARK_HOME=/usr/local/spark
      - PIG_HOME=/usr/local/pig
      - HIVE_HOME=/usr/local/hive
    stdin_open: true
    tty: true
    entrypoint:
      - /bin/bash
      - /entrypoint-hadoop.sh

  hbase:
    image: harisekhon/hbase:latest
    platform: linux/amd64
    container_name: bda-hbase
    hostname: bda-hbase
    restart: unless-stopped
    ports:
      - "16010:16010" # HBase Master Web UI
      - "2181:2181" # ZooKeeper
      - "18080:8080" # HBase REST API (mapped to 18080 to avoid conflict)
      - "8085:8085" # HBase Thrift
    volumes:
      - ..:/workspace
    working_dir: /workspace
    networks:
      - bda-network

networks:
  bda-network:
    driver: bridge

volumes:
  hive-metastore-data:
    driver: local
